<!DOCTYPE html>
<html>
  <head>
    <title>Resume YouTube</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Resume Latest</h2>
    <div id="latest">Loading...</div>
    <h3>Previous</h3>
    <div id="others"></div>
    <button
      id="clear"
      style="
        margin-top: 10px;
        background: #333;
        color: #fff;
        border: 1px solid red;
      "
    >
      Clear All Bookmarks
    </button>

    <script src="popup.js"></script>
  </body>
</html>
